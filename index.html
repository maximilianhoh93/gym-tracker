<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: Die App nutzt den ganzen iPhone-Bildschirm, auch neben Notch und Home-Balken -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Sagt dem Browser, dass die Seite Hell- und Dunkelmodus unterstützt -->
  <meta name="color-scheme" content="light dark">
  <title>GymTracker</title>

  <!-- PWA: Name, Farben und Symbol für "Zum Home-Bildschirm" -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <!-- Symbol auf dem iPhone-Home-Bildschirm (iOS liest es nicht aus dem Manifest) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Vom Home-Bildschirm aus ohne Safari-Leisten starten, wie eine echte App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
  <!-- Farbe der Statusleiste: passend zum Hintergrund, hell und dunkel -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Kopfzeile mit dem Titel der aktuellen Ansicht -->
  <!-- Navigationsleiste oben wie bei iOS: links der Zurück-Link mit dem Namen
       des Ziels, in der Mitte ein kleiner Titel. Der kleine Titel erscheint
       erst, wenn der große Titel beim Scrollen verschwindet. -->
  <header class="app-header">
    <a id="back-link" class="back-link" href="#" hidden>
      <svg class="back-chevron" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>
      <span id="back-label">Zurück</span>
    </a>
    <span id="nav-title" class="nav-title" aria-hidden="true"></span>
  </header>

  <!-- Hauptbereich: Jede Ansicht ist ein eigener <section>-Block.
       Es ist immer nur einer sichtbar, die anderen haben das Attribut "hidden". -->
  <main class="app-main">
    <!-- Großer Titel, scrollt mit dem Inhalt nach oben weg -->
    <h1 id="view-title" class="large-title">Startseite</h1>

    <!-- Der Inhalt dieser Ansichten wird von js/app.js eingefüllt -->
    <section id="view-start" class="view"></section>

    <section id="view-plaene" class="view" hidden></section>

    <section id="view-uebungen" class="view" hidden></section>

    <section id="view-einstellungen" class="view" hidden></section>
  </main>


  <!-- Kurze Einblendung unten, z.B. "Neuer Rekord!". Verschwindet von selbst. -->
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Unsichtbares Feld zur Dateiauswahl. "Sicherung importieren" klickt
       es per JavaScript an; auf dem iPhone öffnet sich die Dateien-App. -->
  <input type="file" id="import-input" accept=".json,application/json,text/plain" hidden>

  <!-- Navigationsleiste unten im Stil von Apples "Liquid Glass": eine
       schwebende, durchscheinende Kapsel, gut mit dem Daumen erreichbar.
       Die Symbole sind kleine SVG-Grafiken aus Linien (angelehnt an Apples
       SF-Symbols). "currentColor" heißt: Sie übernehmen die Textfarbe des
       Tabs, grau oder blau für den aktiven Tab. -->
  <nav class="tab-bar">
    <!-- Gleitende Markierung hinter dem aktiven Tab (Position setzt app.js) -->
    <span class="tab-indicator" aria-hidden="true"></span>
    <a href="#start" class="tab" data-view="start">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-4.5v-6.5h-6V21H4.5a1 1 0 0 1-1-1z"/>
      </svg>
      <span>Start</span>
    </a>
    <a href="#plaene" class="tab" data-view="plaene">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3.5" width="16" height="17" rx="2.5"/>
        <path d="M8 8.5h8M8 12h8M8 15.5h5"/>
      </svg>
      <span>Pläne</span>
    </a>
    <a href="#uebungen" class="tab" data-view="uebungen">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12h19M6 7v10M18 7v10M3.5 9.5v5M20.5 9.5v5"/>
      </svg>
      <span>Übungen</span>
    </a>
    <a href="#einstellungen" class="tab" data-view="einstellungen">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
      <span>Einstellungen</span>
    </a>
  </nav>

  <!-- Reihenfolge wichtig: storage.js zuerst, weil app.js "Store" benutzt -->
  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
