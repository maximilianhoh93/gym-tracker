<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: Die App nutzt den ganzen iPhone-Bildschirm, auch neben Notch und Home-Balken -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Sagt dem Browser, dass die Seite Hell- und Dunkelmodus unterstützt -->
  <meta name="color-scheme" content="light dark">
  <title>Gym-Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Kopfzeile mit dem Titel der aktuellen Ansicht -->
  <header class="app-header">
    <!-- Zurück-Link, nur in Unteransichten sichtbar (z.B. in einem Plan) -->
    <a id="back-link" class="back-link" href="#" hidden>‹ Zurück</a>
    <h1 id="view-title">Startseite</h1>
  </header>

  <!-- Hauptbereich: Jede Ansicht ist ein eigener <section>-Block.
       Es ist immer nur einer sichtbar, die anderen haben das Attribut "hidden". -->
  <main class="app-main">
    <!-- Der Inhalt dieser Ansichten wird von js/app.js eingefüllt -->
    <section id="view-start" class="view"></section>

    <section id="view-plaene" class="view" hidden></section>

    <section id="view-uebungen" class="view" hidden></section>

    <section id="view-daten" class="view" hidden></section>
  </main>

  <!-- Pausentimer-Widget: kleiner Kreis oben links, aufklappbar.
       Erscheint nur, solange ein Timer aktiv ist. Inhalt kommt aus app.js. -->
  <div id="island" class="island" hidden></div>

  <!-- Navigationsleiste unten: dort gut mit dem Daumen erreichbar.
       Die Symbole sind kleine SVG-Grafiken aus Linien (angelehnt an Apples
       SF-Symbols). "currentColor" heißt: Sie übernehmen die Textfarbe des
       Tabs, grau oder blau für den aktiven Tab. -->
  <nav class="tab-bar">
    <a href="#start" class="tab" data-view="start">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-4.5v-6.5h-6V21H4.5a1 1 0 0 1-1-1z"/>
      </svg>
      <span>Start</span>
    </a>
    <a href="#plaene" class="tab" data-view="plaene">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3.5" width="16" height="17" rx="2.5"/>
        <path d="M8 8.5h8M8 12h8M8 15.5h5"/>
      </svg>
      <span>Pläne</span>
    </a>
    <a href="#uebungen" class="tab" data-view="uebungen">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12h19M6 7v10M18 7v10M3.5 9.5v5M20.5 9.5v5"/>
      </svg>
      <span>Übungen</span>
    </a>
    <a href="#daten" class="tab" data-view="daten">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="4.5" rx="1.2"/>
        <path d="M4.5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V8.5M10 12.5h4"/>
      </svg>
      <span>Daten</span>
    </a>
  </nav>

  <!-- Reihenfolge wichtig: storage.js zuerst, weil app.js "Store" benutzt -->
  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
